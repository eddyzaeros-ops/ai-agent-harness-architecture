<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(99, 102, 241, 0.3); }
      50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.6); }
    }
    .active-layer { animation: pulse-glow 2s ease-in-out infinite; }
    .connector { stroke-dasharray: 6 4; stroke-dashoffset: 0; animation: dash 1.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-6">

  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold mb-1">🤖 AI Agent Harness 架構解析</h1>
    <p class="text-[var(--muted-foreground)] text-sm">Agent = Model + Harness — 點擊各層級查看詳細說明</p>
  </div>

  <!-- Main Layout: Diagram + Detail Panel -->
  <div class="flex gap-5 items-start max-w-5xl mx-auto">

    <!-- Architecture Diagram -->
    <div class="flex-1 min-w-0">
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm">

        <!-- Outer Harness Frame -->
        <div class="border-2 border-dashed border-[var(--primary)] rounded-xl p-4 relative">
          <span class="absolute -top-3 left-4 bg-[var(--card)] px-2 text-xs font-semibold text-[var(--primary)] tracking-wide uppercase">Harness 層</span>

          <!-- Layer Cards -->
          <div class="space-y-3 mb-4">
            <button onclick="showDetail('safety')" id="btn-safety"
              class="layer-btn w-full text-left bg-[var(--content)] border border-[var(--border)] rounded-lg px-4 py-3 hover:border-[var(--primary)] transition-all cursor-pointer group">
              <div class="flex items-center gap-3">
                <span class="text-xl">🛡️</span>
                <div>
                  <div class="font-semibold text-sm">安全與護欄 (Safety & Guardrails)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">權限管理 · 人類審批 · 策略執行</div>
                </div>
              </div>
            </button>

            <button onclick="showDetail('orchestration')" id="btn-orchestration"
              class="layer-btn w-full text-left bg-[var(--content)] border border-[var(--border)] rounded-lg px-4 py-3 hover:border-[var(--primary)] transition-all cursor-pointer group">
              <div class="flex items-center gap-3">
                <span class="text-xl">🔄</span>
                <div>
                  <div class="font-semibold text-sm">編排與控制迴圈 (Orchestration)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">規劃 → 執行 → 觀察 → 修正</div>
                </div>
              </div>
            </button>

            <button onclick="showDetail('tools')" id="btn-tools"
              class="layer-btn w-full text-left bg-[var(--content)] border border-[var(--border)] rounded-lg px-4 py-3 hover:border-[var(--primary)] transition-all cursor-pointer group">
              <div class="flex items-center gap-3">
                <span class="text-xl">🔧</span>
                <div>
                  <div class="font-semibold text-sm">工具執行層 (Tool Execution)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">API 呼叫 · 程式碼執行 · 資料庫查詢</div>
                </div>
              </div>
            </button>

            <button onclick="showDetail('memory')" id="btn-memory"
              class="layer-btn w-full text-left bg-[var(--content)] border border-[var(--border)] rounded-lg px-4 py-3 hover:border-[var(--primary)] transition-all cursor-pointer group">
              <div class="flex items-center gap-3">
                <span class="text-xl">🧠</span>
                <div>
                  <div class="font-semibold text-sm">記憶管理 (Memory Management)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">對話歷史 · 長期記憶 · 上下文檢索</div>
                </div>
              </div>
            </button>

            <button onclick="showDetail('observability')" id="btn-observability"
              class="layer-btn w-full text-left bg-[var(--content)] border border-[var(--border)] rounded-lg px-4 py-3 hover:border-[var(--primary)] transition-all cursor-pointer group">
              <div class="flex items-center gap-3">
                <span class="text-xl">📊</span>
                <div>
                  <div class="font-semibold text-sm">可觀測性 (Observability)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">日誌 · 追蹤 · 除錯 · 審計</div>
                </div>
              </div>
            </button>
          </div>

          <!-- Core LLM -->
          <div onclick="showDetail('llm')" id="btn-llm"
            class="layer-btn cursor-pointer bg-gradient-to-r from-indigo-500/10 to-purple-500/10 border-2 border-indigo-500/50 rounded-xl px-4 py-4 text-center hover:border-indigo-400 transition-all">
            <div class="text-2xl mb-1">✨</div>
            <div class="font-bold text-base">大型語言模型 (LLM)</div>
            <div class="text-xs text-[var(--muted-foreground)]">推理 · 理解 · 生成 — 純粹的「大腦」</div>
          </div>
        </div>

        <!-- External World -->
        <div class="mt-4 flex justify-center gap-3 flex-wrap">
          <span class="bg-[var(--content)] border border-[var(--border)] rounded-full px-3 py-1 text-xs">🌐 外部 API</span>
          <span class="bg-[var(--content)] border border-[var(--border)] rounded-full px-3 py-1 text-xs">🗄️ 資料庫</span>
          <span class="bg-[var(--content)] border border-[var(--border)] rounded-full px-3 py-1 text-xs">📁 檔案系統</span>
          <span class="bg-[var(--content)] border border-[var(--border)] rounded-full px-3 py-1 text-xs">👤 使用者</span>
          <span class="bg-[var(--content)] border border-[var(--border)] rounded-full px-3 py-1 text-xs">💻 程式碼沙盒</span>
        </div>
      </div>
    </div>

    <!-- Detail Panel -->
    <div class="w-80 flex-shrink-0">
      <div id="detail-panel" class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm min-h-[300px]">
        <div class="text-center text-[var(--muted-foreground)] py-10">
          <div class="text-4xl mb-3">👈</div>
          <p class="text-sm">點擊左側的任何層級<br>查看詳細說明</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Formula Bar -->
  <div class="max-w-5xl mx-auto mt-5">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-5 py-4 shadow-sm">
      <div class="flex items-center justify-center gap-3 text-lg font-mono font-bold">
        <span class="bg-gradient-to-r from-indigo-500/10 to-purple-500/10 border border-indigo-500/30 rounded-lg px-3 py-1">🤖 Agent</span>
        <span class="text-[var(--muted-foreground)]">=</span>
        <span class="bg-gradient-to-r from-indigo-500/10 to-purple-500/10 border border-indigo-500/30 rounded-lg px-3 py-1">✨ Model</span>
        <span class="text-[var(--muted-foreground)]">+</span>
        <span class="bg-[var(--primary)] text-[var(--primary-foreground)] rounded-lg px-3 py-1">⚙️ Harness</span>
      </div>
      <p class="text-center text-xs text-[var(--muted-foreground)] mt-2">
        模型是引擎，Harness 是底盤、方向盤和安全系統 — 讓引擎變成能在真實世界行駛的車輛
      </p>
    </div>
  </div>

  <script>
    const details = {
      llm: {
        icon: '✨',
        title: '大型語言模型 (LLM)',
        subtitle: 'Agent 的核心「大腦」',
        desc: 'LLM 本身只是一個強大的文字推理與生成引擎。它能理解語言、分析問題、產生程式碼，但它<strong>無法</strong>直接與外部世界互動。',
        points: [
          '📝 文字理解與生成',
          '🧩 邏輯推理與規劃',
          '💡 創意發想與分析',
          '❌ 無法執行程式碼',
          '❌ 無法存取檔案或 API',
          '❌ 無法記住跨會話資訊',
        ],
        analogy: '就像一顆引擎 — 功率強大但無法自行移動'
      },
      safety: {
        icon: '🛡️',
        title: '安全與護欄',
        subtitle: 'Safety & Guardrails',
        desc: '確保 Agent 在安全邊界內運作的守門員層。防止 Agent 執行未授權、危險或不符政策的操作。',
        points: [
          '🔐 使用者權限與認證管理',
          '✋ 敏感操作的人類審批機制 (HITL)',
          '🚫 防止破壞性或越權行為',
          '📋 安全策略與合規檢查',
          '⚠️ 輸入/輸出過濾與驗證',
          '🏷️ 操作範圍與速率限制',
        ],
        analogy: '就像安全氣囊和防鎖煞車 — 保護乘客和行人'
      },
      orchestration: {
        icon: '🔄',
        title: '編排與控制迴圈',
        subtitle: 'Orchestration & Control Loop',
        desc: '驅動 Agent 完成多步驟任務的核心引擎。管理「規劃 → 執行 → 觀察 → 修正」的持續循環。',
        points: [
          '📋 將複雜任務拆解為子步驟',
          '🎯 決定下一步該使用什麼工具',
          '🔍 觀察工具回傳的結果',
          '🔁 錯誤時自動重試或調整策略',
          '🌲 管理多 Agent 協作與委派',
          '⏱️ 超時控制與任務生命週期管理',
        ],
        analogy: '就像方向盤和變速箱 — 控制前進方向和節奏'
      },
      tools: {
        icon: '🔧',
        title: '工具執行層',
        subtitle: 'Tool Execution',
        desc: '連接 LLM 與外部世界的橋樑。讓模型從「說」到「做」，實際執行各種操作。',
        points: [
          '🌐 呼叫外部 API（搜尋、天氣等）',
          '💻 執行程式碼（Python、Shell 等）',
          '🗄️ 查詢與操作資料庫',
          '📁 讀寫檔案系統',
          '🔌 與業務系統整合 (MCP, Function Calling)',
          '📦 管理工具的輸入輸出格式轉換',
        ],
        analogy: '就像輪胎和傳動系統 — 讓動力真正接觸地面'
      },
      memory: {
        icon: '🧠',
        title: '記憶管理',
        subtitle: 'Memory Management',
        desc: 'LLM 的上下文窗口是有限的。記憶管理層負責在會話內和跨會話間持久化和檢索相關資訊。',
        points: [
          '💬 短期記憶：對話歷史管理',
          '📚 長期記憶：向量資料庫存取',
          '🔍 語義搜尋相關上下文 (RAG)',
          '📝 摘要壓縮與關鍵資訊提取',
          '👤 使用者偏好與個性化記錄',
          '📋 跨會話的任務進度追蹤',
        ],
        analogy: '就像 GPS 和行車紀錄器 — 記得去過哪裡、要去哪裡'
      },
      observability: {
        icon: '📊',
        title: '可觀測性',
        subtitle: 'Observability & Debugging',
        desc: '記錄 Agent 的每一個決策和動作，讓開發者能審計、除錯和優化 Agent 的行為。',
        points: [
          '📝 詳細的決策與工具呼叫日誌',
          '🔗 端到端請求追蹤 (Tracing)',
          '📈 效能指標與延遲監控',
          '💰 Token 使用量與成本追蹤',
          '🐛 錯誤診斷與根因分析',
          '📋 合規審計與行為回放',
        ],
        analogy: '就像儀錶板和黑盒子 — 隨時知道車輛的狀態'
      }
    };

    let activeBtn = null;

    function showDetail(key) {
      const d = details[key];
      const panel = document.getElementById('detail-panel');

      // Highlight active button
      document.querySelectorAll('.layer-btn').forEach(b => {
        b.classList.remove('active-layer', 'border-[var(--primary)]');
      });
      const btn = document.getElementById('btn-' + key);
      btn.classList.add('active-layer');
      if (key !== 'llm') btn.classList.add('border-[var(--primary)]');

      panel.innerHTML = `
        <div class="fade-in">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-3xl">${d.icon}</span>
            <div>
              <h3 class="font-bold text-base">${d.title}</h3>
              <p class="text-xs text-[var(--muted-foreground)]">${d.subtitle}</p>
            </div>
          </div>
          <p class="text-sm text-[var(--foreground)] mb-4 leading-relaxed">${d.desc}</p>
          <div class="space-y-2 mb-4">
            ${d.points.map(p => `<div class="text-sm flex items-start gap-2"><span class="flex-shrink-0">${p.slice(0,2)}</span><span>${p.slice(3)}</span></div>`).join('')}
          </div>
          <div class="bg-[var(--content)] border border-[var(--border)] rounded-lg px-3 py-2 mt-3">
            <div class="text-xs text-[var(--muted-foreground)] mb-1 font-semibold">🚗 汽車類比</div>
            <div class="text-sm">${d.analogy}</div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
